<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Account | Cossirae</title>
    <meta name="description" content="Sign in to your Cossirae account to manage orders, wishlist and checkout details.">
    <meta name="robots" content="noindex,follow">
    <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="site.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
  </head>
  <body>
    <header class="site-header dark">
      <a class="brand" href="index.html">Cossirae<span>Wear Your Story</span></a>
      <nav class="main-nav"><a href="shop.html">Shop</a><a href="about.html">About</a><a href="wishlist.html">Wishlist</a></nav>
      <div class="header-actions"><button class="search-trigger" type="button" data-open-search>Search</button><a class="icon-link" href="cart.html">Bag</a><button class="icon-link mobile-only" type="button" data-menu>☰</button></div>
    </header>
    <main class="account-page">
      <div class="account-layout">
        <aside class="account-menu">
          <div class="label">Customer Account</div>
          <p data-auth-state>Not signed in</p>
          <a href="wishlist.html">Wishlist</a>
          <a href="cart.html">Cart</a>
          <button type="button" data-customer-signout>Sign Out</button>
        </aside>
        <section class="panel">
          <p class="eyebrow">Cossirae Account</p>
          <h1 class="page-title">Sign In or Create Account</h1>
          <form class="form-grid" data-customer-auth>
            <label>Full Name<input name="full_name" placeholder="Your name"></label>
            <label>Phone<input name="phone" placeholder="080..."></label>
            <label>Email<input name="email" type="email" required></label>
            <label>Password<input name="password" type="password" required minlength="6"></label>
            <div class="full admin-actions">
              <button class="dark" type="submit" data-auth-mode="signin">Sign In</button>
              <button type="submit" data-auth-mode="signup">Create Account</button>
            </div>
          </form>
        </section>
      </div>
    </main>
    <footer class="site-footer"><a class="brand" href="index.html">Cossirae</a><nav class="footer-nav"><a href="shop.html">Shop</a><a href="about.html">About</a><a href="cart.html">Cart</a></nav><div class="socials"><a href="#">Instagram</a></div></footer>
    <script src="assets/js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://js.paystack.co/v2/inline.js"></script>
    <script src="assets/js/main.js"></script>
  </body>
</html>
