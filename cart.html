<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cart | Cossirae</title>
    <meta name="description" content="Review your Cossirae bag and complete checkout for contemporary African women's fashion.">
    <meta name="robots" content="noindex,follow">
    <link rel="canonical" href="https://cossirae.ng/cart.html">
    <meta name="theme-color" content="#21140d">
    <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="site.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
  </head>
  <body>
    <header class="site-header dark"><a class="brand" href="index.html">Cossirae<span>Wear Your Story</span></a><nav class="main-nav"><a href="shop.html">Shop</a><a href="about.html">About</a></nav><div class="header-actions"><button class="search-trigger" type="button" data-open-search>Search</button><a class="icon-link" href="account.html" aria-label="Account">Acct</a><a class="icon-link" href="wishlist.html">♡</a><a class="icon-link" href="cart.html">Bag</a><button class="icon-link mobile-only" type="button" data-menu>☰</button></div></header>
    <main class="cart-page">
      <h1 class="page-title" data-cart-title>Your Cart (0)</h1>
      <div class="checkout-layout">
        <section data-cart-list>
        </section>
        <form class="checkout-box" data-checkout-form>
          <h2 class="section-heading">Secure Checkout</h2>
          <label>Full Name<input name="name" type="text" required></label><label>Phone Number<input name="phone" type="tel" required></label><label>Email<input name="email" type="email" required></label><label>Address<input name="address" type="text" required></label><label>City<input name="city" type="text" required></label><label>Payment Method<select name="payment_method" required><option>Card</option><option>Bank Transfer</option><option>Cash on Delivery</option></select></label>
          <p class="section-top"><span>Subtotal</span><strong data-cart-subtotal>₦0</strong></p>
          <p class="section-top"><span>Total</span><strong data-cart-total>₦0</strong></p><button class="dark" type="submit">Place Order</button>
        </form>
      </div>
    </main>
    <footer class="site-footer"><a class="brand" href="index.html">Cossirae</a><nav class="footer-nav"><a href="shop.html">Shop</a><a href="about.html">About</a><a href="admin.html">Admin</a></nav><div class="socials"><a href="#">Instagram</a></div></footer>
    <script src="assets/js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="assets/js/main.js"></script>
  </body>
